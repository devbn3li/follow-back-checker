name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build signed release
        run: gradle assembleRelease --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "FollowCheck-${GITHUB_REF_NAME}.apk"
      # The panel's update notice reads the script version from the release notes and offers the extension zip.
      - name: Script version and extension zip
        run: |
          echo "SCRIPT_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          (cd extension && zip -r "../follow-back-checker-extension-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Script version ${{ env.SCRIPT_VERSION }}
          files: |
            FollowCheck-*.apk
            follow-back-checker-extension-*.zip
            dist/follow-back-checker.user.js
            dist/checker.js
